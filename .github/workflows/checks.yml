name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web and model downloads
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: python3 -m unittest discover -s scripts/tests -v
  core:
    name: Document and sync core
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift test -j 2
  native:
    name: Native apps
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: brew install xcodegen
      - run: npm ci --prefix web && npm run build --prefix web
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare locked iOS Python runtime
        run: python3 scripts/bootstrap-lab.py
      - name: Generate native project
        run: |
          xcodegen generate --spec native/project.yml
          mkdir -p native/ArchiiVault.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp native/Package.resolved native/ArchiiVault.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Compile Mac application
        run: xcodebuild -project native/ArchiiVault.xcodeproj -scheme ArchiiVaultMac -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/native -jobs 2 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Compile iPhone and iPad application
        run: xcodebuild -project native/ArchiiVault.xcodeproj -scheme ArchiiVault -configuration Release -destination 'generic/platform=iOS' -derivedDataPath .build/native -jobs 2 CODE_SIGNING_ALLOWED=NO build
